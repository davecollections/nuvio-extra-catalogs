name: Validate awards data

on:
  pull_request:
    paths:
      - "catalog/**"
      - "data/**"
      - "docs/**"
      - "reports/**"
      - "schema/**"
      - "scripts/**"
      - "manifest.json"
      - "presets/**"
      - "index.html"
      - ".github/workflows/validate-awards-data.yml"
  push:
    branches:
      - main
    paths:
      - "catalog/**"
      - "data/**"
      - "docs/**"
      - "reports/**"
      - "schema/**"
      - "scripts/**"
      - "manifest.json"
      - "presets/**"
      - "index.html"
      - ".github/workflows/validate-awards-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical awards data
        run: python scripts/validate_awards_data.py

      - name: Validate BAFTA current source registry
        run: python scripts/validate_bafta_source_registry.py

      - name: Validate BAFTA winner source snapshots
        run: python scripts/validate_bafta_source_snapshots.py

      - name: Validate BAFTA category-page evidence
        run: python scripts/validate_bafta_category_page_evidence.py

      - name: Validate BAFTA lineage decisions
        run: python scripts/validate_bafta_lineage_decisions.py --complete

      - name: Validate BAFTA category definitions
        run: python scripts/validate_bafta_category_definitions.py

      - name: Check BAFTA identity inventory
        run: python scripts/build_bafta_identity_seed.py --check

      - name: Validate BAFTA reviewed identities
        run: python scripts/enrich_bafta_identities.py --check --attempted

      - name: Require complete BAFTA Film identity review
        run: python scripts/enrich_bafta_identities.py --check --complete --programme film

      - name: Check BAFTA identity review report
        run: python scripts/build_bafta_identity_review.py --check

      - name: Check BAFTA Film canonical import
        run: python scripts/build_bafta_film_canonical.py --check

      - name: Check BAFTA Film generated outputs
        run: python scripts/build_bafta_film_outputs.py --check

      - name: Check BAFTA Film artwork audit evidence
        run: python scripts/audit_bafta_film_artwork.py --offline-check

      - name: Check BAFTA category lineage audit inventory
        run: python scripts/build_bafta_lineage_audit.py --check

      - name: Check Best Picture generated output
        run: python scripts/build_best_picture_catalog.py --check

      - name: Check Best Actor generated outputs
        run: python scripts/build_best_actor_outputs.py --check

      - name: Check Best Actress generated outputs
        run: python scripts/build_best_actress_outputs.py --check

      - name: Check Best Supporting Actor generated outputs
        run: python scripts/build_best_supporting_actor_outputs.py --check

      - name: Check Best Supporting Actress generated outputs
        run: python scripts/build_best_supporting_actress_outputs.py --check

      - name: Check Best Director generated outputs
        run: python scripts/build_best_director_outputs.py --check

      - name: Check remaining Academy generated outputs
        run: python scripts/build_remaining_academy_outputs.py --check

      - name: Check Golden Globes identity map
        run: python scripts/enrich_golden_globes_identities.py --check

      - name: Check Golden Globes canonical import
        run: python scripts/build_golden_globes_canonical.py --check

      - name: Check Golden Globes generated outputs
        run: python scripts/build_golden_globes_outputs.py --check

      - name: Check award-level manifest presets
        run: python scripts/build_manifest_presets.py --check

      - name: Validate manifest and catalogue payloads
        run: python scripts/validate_manifest_catalogs.py

      - name: Check Awards People artwork integration
        run: python scripts/check_people_artwork_integration.py --check

      - name: Check Issue 24 recipient identity coverage
        run: python scripts/check_issue24_recipient_identity_coverage.py --check
